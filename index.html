<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الدودة">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>الدودة 🐍</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a14;--ink:#eafff0;--card:#16291f;--acc:#7CFC9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e7f6ea;--ink:#12301c;--card:#fff}}
:root[data-theme="light"]{--bg:#e7f6ea;--ink:#12301c;--card:#fff}
:root[data-theme="dark"]{--bg:#0e1a14;--ink:#eafff0;--card:#16291f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
h1{font:400 clamp(2.2rem,9vw,3.4rem) Lalezar;margin:0;letter-spacing:1px}
h1 span{color:#3ddc6a}
.hud{display:flex;gap:10px;width:var(--w)}
.pill{flex:1;background:var(--card);border-radius:16px;padding:8px 12px;text-align:center;font-weight:800;box-shadow:0 3px 0 #0003}
.pill b{display:block;font:400 1.6rem Lalezar;color:#3ddc6a}
.wrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #0006,0 0 0 4px var(--card)}
canvas{display:block}
#ov{position:absolute;inset:0;background:#0b1510cc;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:#eafff0;padding:16px}
#ov h2{font:400 2.4rem Lalezar;margin:0;color:#7CFC9a}
#ov p{margin:0;opacity:.85}
button{font:800 1rem Tajawal;border:0;border-radius:99px;padding:11px 24px;background:#3ddc6a;color:#062010;cursor:pointer;box-shadow:0 4px 0 #1b8a3b}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b8a3b}
.modes{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;justify-content:center}
.modes button{background:#16291f;color:#eafff0;box-shadow:0 3px 0 #0006;padding:8px 12px;font-size:.9rem;border:2px solid transparent}
.modes button.on{background:#3ddc6a;color:#062010;border-color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#shop,#lb{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:12px}
#shop.on,#lb.on{display:flex}
.panel{background:var(--card);color:var(--ink);border-radius:24px;padding:16px;width:min(96vw,440px);max-height:92vh;overflow:auto;text-align:center;touch-action:pan-y}
.panel h2{font:400 1.8rem Lalezar;margin:0}
.bal{font:400 1.5rem Lalezar;color:#3ddc6a;margin:2px 0 4px}
.hint2{font-size:.8rem;opacity:.7;margin-bottom:8px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk{background:rgba(127,127,127,.14);border:2px solid transparent;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sk.sel{border-color:#3ddc6a}
.sk b{font-size:.8rem}
.sk canvas{width:84px;height:30px;max-width:100%}
.sk button{padding:6px 10px;font-size:.8rem;box-shadow:0 3px 0 #1b8a3b}
.sk button.lock{background:#8a8a8a;box-shadow:0 3px 0 #555;color:#fff}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px 0 10px}
.tabs button{padding:6px 12px;font-size:.85rem;background:rgba(127,127,127,.25);color:var(--ink);box-shadow:none}
.tabs button.on{background:#3ddc6a;color:#062010}
.lbrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(127,127,127,.14);margin:5px 0;font-weight:800}
.lbrow span:nth-child(2){flex:1;text-align:right}
.lbrow b{font:400 1.3rem Lalezar;color:#3ddc6a}
.lbrow.top{background:rgba(255,210,63,.24)}
#nbox{display:none;gap:6px;margin:4px 0;align-items:center;justify-content:center;flex-wrap:wrap}
#nbox input{font:700 1rem Tajawal;padding:8px 12px;border-radius:99px;border:2px solid #3ddc6a;background:#0b1510;color:#eafff0;width:140px;text-align:center;outline:none}
#smsg{min-height:1.4em;font-weight:800;color:#ff6b4a;margin:8px 0}
.row button{background:var(--card);color:var(--ink);box-shadow:0 3px 0 #0003;font-size:.9rem;padding:8px 16px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px;direction:ltr}
.dpad button{width:58px;height:58px;padding:0;font-size:1.6rem;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 #0004;touch-action:none}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0004;background:#3ddc6a;color:#062010}
</style>
</head>
<body>
<h1>الدودة <span>🐍</span></h1>
<div class="hud" id="hud"><div class="pill">النقاط<b id="sc">0</b></div><div class="pill"><span id="bl">الأفضل</span><b id="bs">0</b></div><div class="pill">المستوى<b id="lv">1</b></div></div>
<div class="wrap" id="wrap"><canvas id="c"></canvas>
<div id="ov"><h2 id="ot">جاهز؟</h2><p id="om">اختار السرعة وابدأ فورًا 👇</p><div id="nbox"><input id="pn" maxlength="12" placeholder="اكتب اسمك" autocomplete="off"><button id="nsave">سجّل 🏆</button></div><div class="modes" id="modes"></div><button id="ob">ابدأ اللعب</button></div></div>
<div class="row"><button id="wl">الجدران: قاتلة 🧱</button><button id="ps">إيقاف ⏸</button><button id="lbb">🏆 الصدارة</button><button id="shopb">🛒 المتجر · 🍎 <span id="ap">0</span></button></div>
<div class="dpad">
<button data-d="0,-1" style="grid-column:2;grid-row:1" aria-label="فوق">▲</button>
<button data-d="-1,0" style="grid-column:1;grid-row:2" aria-label="يسار">◀</button>
<button data-d="0,1" style="grid-column:2;grid-row:2" aria-label="تحت">▼</button>
<button data-d="1,0" style="grid-column:3;grid-row:2" aria-label="يمين">▶</button>
</div>
<div id="shop"><div class="panel"><h2>🛒 متجر الأشكال</h2><div class="bal">🍎 <span id="sbal">0</span></div>
<div class="hint2">كل تفاحة 🍎 = 1 · التفاحة الذهبية 🌟 = 5</div><div class="sgrid" id="sgrid"></div><div id="smsg"></div><button id="sclose">إغلاق</button></div></div>
<div id="lb"><div class="panel"><h2>🏆 قائمة الصدارة</h2><div class="tabs" id="tabs"></div><div id="lbl"></div><br><button id="lclose">إغلاق</button></div></div>
<script>
const N=20,cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov');
let S,cell,state='ready',snake,dir,q,food,gold,score,best=0,lv,speed,acc=0,last=0,wrap=false,slow=0,eaten,parts=[],shake=0,hue=130;
const M=[{n:'هادي',e:'🐢',b:190,m:115,d:8},{n:'عادي',e:'🐍',b:140,m:65,d:9},{n:'سريع',e:'🚀',b:95,m:42,d:6}];
let mode=1;try{const m=localStorage.getItem('snakeMode');if(m!==null&&M[+m])mode=+m}catch(e){}
function loadBest(){try{best=+localStorage.getItem('snakeBest'+mode)||0}catch(e){best=0}bs.textContent=best;bl.textContent='الأفضل · '+M[mode].n}
function drawModes(){modes.innerHTML='';M.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.e+' '+o.n;if(i===mode)b.className='on';
 b.onclick=()=>{mode=i;try{localStorage.setItem('snakeMode',i)}catch(e){}loadBest();drawModes();ob.style.display='none';
start()};modes.append(b)})}
loadBest();drawModes();ob.style.display='none';
const SK=[
{n:'الكلاسيك',e:'🐍',p:0,c:(i,k)=>slow>0?`hsl(${45+i*3},95%,${62-k*15}%)`:`hsl(${hue+i*5},75%,${58-k*14}%)`},
{n:'جليدي',e:'❄️',p:25,c:(i,k)=>`hsl(${195+k*20},85%,${72-k*22}%)`},
{n:'وردي',e:'🍬',p:35,c:(i,k)=>`hsl(${330+k*15},85%,${72-k*18}%)`},
{n:'ليلي',e:'🔮',p:45,c:(i,k)=>`hsl(${265+k*30},70%,${62-k*22}%)`},
{n:'ملكي',e:'👑',p:60,g:'#ffd23f',c:(i,k)=>`hsl(${48-k*8},100%,${58-k*14}%)`},
{n:'ناري',e:'🔥',p:80,g:'#ff5a1f',c:(i,k,t)=>`hsl(${5+k*50+Math.sin(t/120+i)*8},100%,${52+Math.sin(t/100+i)*6}%)`},
{n:'قوس قزح',e:'🌈',p:110,c:(i,k,t)=>`hsl(${(t/8+i*22)%360},90%,60%)`},
{n:'شبح',e:'👻',p:140,g:'#cfe8ff',c:(i,k)=>`rgba(235,245,255,${.9-k*.55})`},
{n:'نيون',e:'⚡',p:180,g:'#00ffe0',c:(i,k)=>`hsl(${175+k*20},100%,${55-k*10}%)`}
];
let apples=0,owned=[0],skin=0;
try{apples=+localStorage.getItem('snakeApples')||0;owned=JSON.parse(localStorage.getItem('snakeOwned')||'[0]');skin=+localStorage.getItem('snakeSkin')||0}catch(e){}
if(!Array.isArray(owned)||!owned.includes(0))owned=[0,...(Array.isArray(owned)?owned:[])];if(!SK[skin]||!owned.includes(skin))skin=0;
const saveShop=()=>{try{localStorage.setItem('snakeApples',apples);localStorage.setItem('snakeOwned',JSON.stringify(owned));localStorage.setItem('snakeSkin',skin)}catch(e){}};
const updAp=()=>{ap.textContent=apples;sbal.textContent=apples};
const gain=n=>{apples+=n;saveShop();updAp()};
updAp();
function paintPrev(cv2,i,t){const g=cv2.getContext('2d'),s=SK[i];g.clearRect(0,0,168,60);g.shadowBlur=s.g?10:0;g.shadowColor=s.g||'transparent';
 for(let j=0;j<6;j++){const d=5-j;g.fillStyle=s.c(d,d/6,t);g.beginPath();g.roundRect(8+j*25,16,26,28,10);g.fill()}
 g.shadowBlur=0;[25,37].forEach(y=>{g.fillStyle='#fff';g.beginPath();g.arc(148,y,5,0,6.3);g.fill();g.fillStyle='#111';g.beginPath();g.arc(150,y,2.4,0,6.3);g.fill()})}
let mt;function msg(t){smsg.textContent=t;clearTimeout(mt);mt=setTimeout(()=>smsg.textContent='',2200)}
function renderShop(){sgrid.innerHTML='';SK.forEach((s,i)=>{const own=owned.includes(i),sel=skin===i,d=document.createElement('div');d.className='sk'+(sel?' sel':'');
 d.innerHTML='<canvas width="168" height="60"></canvas><b>'+s.e+' '+s.n+'</b>';
 const b=document.createElement('button');b.textContent=sel?'✓ مُختار':own?'اختار':'🍎 '+s.p;if(!own&&apples<s.p)b.className='lock';
 b.onclick=()=>{if(own){skin=i;beep(600,.06,'triangle',.08)}else if(apples>=s.p){apples-=s.p;owned.push(i);skin=i;beep(880,.15,'sine',.12);setTimeout(()=>beep(1175,.2,'sine',.12),90);msg('🎉 مبروك! فتحت شكل '+s.n)}else{beep(150,.15,'sawtooth',.08);msg('ناقصك '+(s.p-apples)+' تفاحة 🍎');return}
  saveShop();updAp();renderShop()};d.append(b);sgrid.append(d)})}
function shopLoop(t){if(!shop.classList.contains('on'))return;sgrid.querySelectorAll('canvas').forEach((c,i)=>paintPrev(c,i,t));requestAnimationFrame(shopLoop)}
shopb.onclick=()=>{if(state==='run')pause();renderShop();shop.classList.add('on');requestAnimationFrame(shopLoop)};
sclose.onclick=()=>shop.classList.remove('on');
let pending=null,pname='',lbm=mode;try{pname=localStorage.getItem('snakeName')||''}catch(e){}
const getLB=m=>{try{return JSON.parse(localStorage.getItem('snakeLB'+m)||'[]')}catch(e){return[]}};
const qualifies=(m,sc)=>{if(sc<=0)return false;const a=getLB(m);return a.length<10||sc>a[a.length-1].s};
function commit(){if(!pending)return;const nm=(pn.value.trim()||pname||'لاعب').slice(0,12);pname=nm;
 try{localStorage.setItem('snakeName',nm);const a=getLB(pending.m);a.push({n:nm,s:pending.s,d:Date.now()});a.sort((u,v)=>v.s-u.s||u.d-v.d);localStorage.setItem('snakeLB'+pending.m,JSON.stringify(a.slice(0,10)))}catch(e){}
 pending=null;nbox.style.display='none'}
function renderLB(){tabs.innerHTML='';M.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.e+' '+o.n;if(i===lbm)b.className='on';b.onclick=()=>{lbm=i;renderLB()};tabs.append(b)});
 const a=getLB(lbm),med=['🥇','🥈','🥉'];lbl.innerHTML='';
 if(!a.length)lbl.innerHTML='<p>ما في أرقام لسا… كون أنت الأول! 🥇</p>';
 a.forEach((r,i)=>{const d=document.createElement('div');d.className='lbrow'+(i<3?' top':'');
  const n=document.createElement('span');n.textContent=r.n;
  d.innerHTML='<span>'+(med[i]||(i+1))+'</span>';d.append(n);const sc=document.createElement('b');sc.textContent=r.s;d.append(sc);lbl.append(d)})}
function openLB(m){commit();if(state==='run')pause();lbm=m;renderLB();lb.classList.add('on')}
lbb.onclick=()=>openLB(mode);lclose.onclick=()=>lb.classList.remove('on');nsave.onclick=()=>{const m=pending?pending.m:mode;openLB(m)};
function size(){const vh=window.visualViewport?visualViewport.height:innerHeight,wr=document.getElementById('wrap');
 const kids=[...document.body.children].filter(e=>e.tagName!=='SCRIPT'&&e.id!=='shop'&&e.id!=='lb');
 const others=kids.filter(e=>e!==wr).reduce((a,e)=>a+e.offsetHeight,0)+12*(kids.length-1);
 S=Math.floor(Math.max(200,Math.min(innerWidth-24,vh-others-30,640))/N)*N;cell=S/N;const d=Math.min(devicePixelRatio||1,2);
 cv.style.width=cv.style.height=S+'px';cv.width=cv.height=S*d;x.setTransform(d,0,0,d,0,0);document.documentElement.style.setProperty('--w',S+'px')}
size();addEventListener('resize',size);addEventListener('load',size);if(document.fonts)document.fonts.ready.then(size);
let ac;function beep(f,d=.08,t='square',v=.07){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const free=()=>{let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x==p.x&&s.y==p.y)||(food&&food.x==p.x&&food.y==p.y)||(gold&&gold.x==p.x&&gold.y==p.y));return p};
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};q=[];score=0;lv=1;speed=M[mode].b;eaten=0;gold=null;slow=0;food=null;food=free();hud()}
function hud(){sc.textContent=score;bs.textContent=best;lv_.textContent=lv}
const lv_=document.getElementById('lv');
function start(){commit();reset();state='run';ov.style.display='none';last=performance.now();acc=0;beep(520,.1)}
function turn(dx,dy){if(state==='ready'||state==='over')return;
 const l=q.length?q[q.length-1]:dir;if(l.x===-dx&&l.y===-dy||l.x===dx&&l.y===dy)return;if(q.length<3)q.push({x:dx,y:dy})}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
 if(m){e.preventDefault();if(state!=='run'&&state!=='pause'){start()}turn(...m)}
 if(e.key===' '){e.preventDefault();state==='run'||state==='pause'?pause():start()}});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(tx==null||shop.classList.contains('on')||lb.classList.contains('on'))return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
 if(Math.max(Math.abs(dx),Math.abs(dy))>22){Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1);tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
addEventListener('touchend',()=>tx=null);
document.querySelectorAll('.dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();
 const [dx,dy]=b.dataset.d.split(',').map(Number);
 if(state==='pause')pause();else if(state!=='run')start();
 turn(dx,dy);beep(300,.03,'square',.03)}));
function pause(){if(state==='run'){state='pause';ov.style.display='flex';modes.style.display='none';ob.style.display='';ot.textContent='متوقفة ⏸';om.textContent='خذ نفس…';ob.textContent='كمّل'}
 else if(state==='pause'){state='run';ov.style.display='none';last=performance.now()}}
ob.onclick=()=>state==='pause'?pause():start();ps.onclick=pause;
wl.onclick=()=>{wrap=!wrap;wl.textContent=wrap?'الجدران: عبور 🌀':'الجدران: قاتلة 🧱'};
function boom(px,py,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=1+Math.random()*3;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}
function over(){state='over';shake=14;beep(120,.4,'sawtooth',.12);
 const nb=score>best;if(nb){best=score;try{localStorage.setItem('snakeBest'+mode,best)}catch(e){}}hud();
 boom(snake[0].x*cell+cell/2,snake[0].y*cell+cell/2,'#ff5a5a',30);
 setTimeout(()=>{ov.style.display='flex';modes.style.display='flex';ob.style.display='none';ot.textContent=nb&&score>0?'🏆 رقم قياسي!':'خسرت 💀';om.textContent=`جمعت ${score} نقطة · اختار سرعة وعيد 👇`;ob.textContent='العب مرة تانية';if(qualifies(mode,score)){pending={m:mode,s:score};pn.value=pname;nbox.style.display='flex';om.textContent+=' · 🏆 دخلت الصدارة!'}},600)}
function step(){if(q.length)dir=q.shift();let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}else if(h.x<0||h.y<0||h.x>=N||h.y>=N)return over();
 if(snake.some((s,i)=>i<snake.length-1&&s.x==h.x&&s.y==h.y))return over();
 snake.unshift(h);let grow=false;
 if(h.x==food.x&&h.y==food.y){grow=true;score++;eaten++;gain(1);beep(660+eaten*10,.09,'triangle');boom(h.x*cell+cell/2,h.y*cell+cell/2,'#ff4d4d');food=free();
  if(eaten%4==0&&!gold)gold={...free(),t:6000}}
 if(gold&&h.x==gold.x&&h.y==gold.y){grow=true;score+=5;gain(5);slow=4000;beep(880,.2,'sine',.12);setTimeout(()=>beep(1175,.3,'sine',.12),90);boom(h.x*cell+cell/2,h.y*cell+cell/2,'#ffd23f',34);gold=null;shake=6;snake.push({...snake[snake.length-1]})}
 if(!grow)snake.pop();
 const nl=1+Math.floor(score/8);if(nl>lv){lv=nl;hue=(hue+55)%360;beep(990,.25,'sine',.1)}
 speed=Math.max(M[mode].m,M[mode].b-(lv-1)*M[mode].d);hud()}
function loop(t){const dt=Math.min(t-last,100);last=t;
 if(state==='run'){acc+=dt;if(slow>0)slow-=dt;if(gold){gold.t-=dt;if(gold.t<=0)gold=null}
  const sp=slow>0?speed*1.7:speed;while(acc>=sp&&state==='run'){acc-=sp;step()}}
 draw(t);requestAnimationFrame(loop)}
function rr(px,py,w,r,c){x.fillStyle=c;x.beginPath();x.roundRect(px,py,w,w,r);x.fill()}
function draw(t){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=(i+j)%2?`hsl(${hue},38%,17%)`:`hsl(${hue},38%,20%)`;x.fillRect(i*cell,j*cell,cell,cell)}
 if(!snake){x.restore();return}
 if(slow>0){x.fillStyle='rgba(255,210,63,.07)';x.fillRect(0,0,S,S)}
 const p=1+.12*Math.sin(t/180);
 x.font=cell*.9+'px serif';x.textAlign='center';x.textBaseline='middle';
 x.save();x.translate(food.x*cell+cell/2,food.y*cell+cell/2);x.scale(p,p);x.fillText('🍎',0,2);x.restore();
 if(gold){const gx=gold.x*cell+cell/2,gy=gold.y*cell+cell/2;x.save();x.shadowColor='#ffd23f';x.shadowBlur=18;
  x.translate(gx,gy);x.scale(p*1.15,p*1.15);x.fillText('🌟',0,2);x.restore();
  x.strokeStyle='#ffd23f';x.lineWidth=3;x.beginPath();x.arc(gx,gy,cell*.8,-1.57,-1.57+6.28*gold.t/6000);x.stroke()}
 const sk=SK[skin];if(sk.g){x.shadowColor=sk.g;x.shadowBlur=cell*.7}
 snake.forEach((s,i)=>{const k=i/snake.length,c=sk.c(i,k,t),m=i?cell*.07:cell*.02;

 const h=snake[0],cx=h.x*cell+cell/2,cy=h.y*cell+cell/2,d=q.length?q[0]:dir,e=cell*.2;
 [-1,1].forEach(sd=>{const ex=cx+d.x*e*.9-d.y*sd*e,ey=cy+d.y*e*.9+d.x*sd*e;

 parts=parts.filter(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.08;q.l-=.025;x.globalAlpha=Math.max(q.l,0);x.fillStyle=q.c;x.fillRect(q.x,q.y,4,4);x.globalAlpha=1;return q.l>0});
 x.restore()}
